name: CI

# Ported from .gitlab-ci.yml + 2026-05-05 hardening (DeelMarkt-borrowed:
# OSV-Scanner replacing retire.js, TruffleHog alongside gitleaks, Trivy
# filesystem scan, SHA-pinned actions, concurrency cancellation, timeout
# caps).
#
# Out-of-scope: build_image / trivy image / trigger_deploy_pipeline —
# those reintroduce when the new deploy strategy lands. Image-pushing
# does NOT happen here today.
#
# Security: this workflow uses no untrusted-input expressions
# (PR title/body/branch/commit) in run: commands. All inputs are
# either secrets.GITHUB_TOKEN or static literals. All third-party
# actions are pinned to immutable SHAs.
#
# Supply chain (sonar githubactions:S6505 / S8543, hardened 2026-07-25):
#   * every install passes --ignore-scripts, so a compromised (direct OR
#     transitive) package cannot execute code on the runner at install time.
#     Verified safe for THIS lockfile: only @sentry/cli, core-js, fsevents
#     and unrs-resolver declare install scripts. core-js/fsevents are
#     optional (fsevents is darwin-only), unrs-resolver's is a check, and
#     @sentry/cli's binary is only needed by withSentryConfig source-map
#     upload — which this repo does not use. next's SWC and sharp's libvips
#     both arrive as prebuilt optionalDependencies, NOT via lifecycle
#     scripts, so `next build` is unaffected. Re-verify with a full
#     build + test run before adding a dependency that needs a postinstall.
#   * no bare `npx <tool>`: npx silently falls back to fetching an
#     unpinned release from the registry when the local binary is missing.
#     Tools are invoked through package.json scripts instead, which resolve
#     only against the lockfile-pinned node_modules and fail loudly.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel stale runs when a new push lands on the same PR — saves
# free-tier Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No `install_deps` fan-in job: every job below restores the npm tarball cache
# through its own `actions/setup-node` `cache: npm` (measured: all of them log a
# cache HIT) and then runs its own `npm ci`. A shared warm-up job therefore warms
# nothing — it only serialised the pipeline, delaying every heavy job by ~34s.
# Removed 2026-08-16 (CI-PERFORMANCE-PLAN F3).
jobs:
  prettier_check:
    name: prettier --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: npm run format:check

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: npm run typecheck

  i18n_parity:
    # Locale-parity gate (ADR-003, DEV-PHASES-PLAN W1) - BLOCKING since the
    # parity repair landed (deterministic check, no flake surface).
    name: i18n parity (10 locales)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-locale-parity.mjs
      # Parity compares the ten bundles against EACH OTHER, so a key missing from all ten is
      # perfectly consistent and passes it. This reads the CALLSITES instead — the only way to see
      # a `t()` that renders its own key to a user (#417).
      - run: node scripts/check-t-keys.mjs

  baseline_dimensions:
    # Screenshot baselines must be exactly their viewport's width. A full-page capture
    # of a horizontally-overflowing page is WIDER than the viewport rather than clipped,
    # and every downstream check compares the image to itself — so a 442px mobile page
    # once shipped past three reviews. Plain file check: no browser, no server, so it
    # runs on every PR rather than only when Screenshots is dispatched.
    name: screenshot baseline dimensions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-baseline-dimensions.mjs

  eslint:
    name: eslint (--max-warnings=0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: npm run lint

  npm_test:
    name: npm test (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      # --coverage activates the `coverageThreshold` block in jest.config.js
      # which fails the run if global stmt/branch/func/line % drops below
      # the pinned floor. See jest.config.js for the rationale + ratchet
      # policy. Mirrors the backend's coverlet gate (workspace CLAUDE.md §7).
      # Runs with jest's default worker pool (no --runInBand): the suite is
      # parallel-safe and per-file coverage is worker-invariant — verified by
      # a byte-identical coverage table serial vs parallel (CI-PERFORMANCE-PLAN F4).
      - run: npm test -- --ci --coverage

  bundle_size:
    # First-Load-JS budget gate (DEV-PHASES-PLAN W2, D2 performance) — fails if
    # any route's gzipped first-load JS grows >10% past the committed baseline
    # (scripts/bundle-size-baseline.json). Deterministic: needs the production
    # build but no running server and no backend. `.env.production` is auto-read
    # by `next build`; the NEXT_PUBLIC_* build-args are optional (string values
    # don't change bundle shape). Re-baseline via `--update` when growth is
    # intended — see scripts/check-bundle-size.mjs.
    name: bundle size (First Load JS budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      # Next.js incremental build cache. This job logged "⚠ No build cache found"
      # on every run until now, so `next build` recompiled the whole tree each
      # time (measured 2026-08-16: 92s on run 31977679689). Keyed on the lockfile
      # AND a hash of every input `next build` reads, so an exact hit can only
      # come from a tree that produces the same output; `restore-keys` then falls
      # back to the newest cache for the same dependency set, which is what
      # actually pays — Next reuses the compilation units that did not change.
      # The gate itself is unaffected: check-bundle-size.mjs reads the emitted
      # route sizes, and an incremental build emits the same bundles as a cold
      # one (the cache only stores intermediate compiler output).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-bundle-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', '.env.production') }}
          restore-keys: |
            ${{ runner.os }}-next-bundle-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: node scripts/check-bundle-size.mjs

  npm_audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
        # Not a bare `npm audit --audit-level=high`: npm has no ignore mechanism,
        # so an advisory with no reachable patched version leaves only "force an
        # incompatible major" or "delete the gate". The wrapper makes accepting one
        # an explicit, dated entry in .npm-audit-allowlist.json instead, and fails
        # when an acceptance expires. Same house pattern as .retireignore.json.
      # `npm audit` exits non-zero on any finding, so the pipeline's status is the
      # parser's — it is the one that decides whether a finding is accepted.
      - run: npm audit --json | node scripts/check-npm-audit.mjs

  file_length:
    name: file-length (CLAUDE.md §4)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: bash scripts/check-file-length.sh --all

  bare_catch:
    name: bare-catch ratchet (E9)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-bare-catch.mjs

  physical_css:
    name: physical-CSS ratchet (E8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-physical-css.mjs

  composes_overrides:
    name: composes override determinism (#447)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-composes-overrides.mjs

  css_selectors:
    name: CSS selectors are selectors (§6.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-css-selectors.mjs

  css_module_bindings:
    name: CSS-module bindings resolve (§6.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-css-module-bindings.mjs

  undefined_css_vars:
    name: custom properties resolve (#489)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-undefined-css-vars.mjs

  provider_host_urls:
    name: no dead provider-hostname URLs (#559)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/check-provider-host-urls.mjs

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Use the binary directly — gitleaks-action requires a paid license
      # for organizations; the OSS CLI is free under MIT.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzf - -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --verbose --redact --source .

  trufflehog:
    name: TruffleHog (secret scan, complementary to gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs — TruffleHog's diff-scan needs BASE != HEAD.
    # On a push to main/develop, BASE (default branch) == HEAD, which
    # the action errors on. Gitleaks already does the full-filesystem
    # secret scan on every push, so coverage doesn't regress.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  trivy_fs:
    name: Trivy filesystem (misconfig + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  njsscan:
    name: njsscan (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ajinabraham/njsscan-action@c7b65a3590ade829628b2b3c87b34ac0ce666a79 # master
        with:
          args: '. --exit-warning'

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    # Non-blocking: surfaces findings without failing the pipeline.
    continue-on-error: true
    env:
      SEMGREP_RULES: p/javascript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: semgrep ci

  osv_scanner:
    name: OSV-Scanner (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=table

  license_compliance:
    name: license-compliance (transitive NPM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mirrors trivy_fs / gitleaks: SHA-pinned checkout, capped timeout,
    # concurrency cancellation (inherited from top-level `concurrency`).
    #
    # Fails the build if any installed NPM package (direct OR transitive,
    # production-only) carries a license outside the allowlist at repo-root
    # `LICENSES.allowlist`.
    #
    # Tool: license-checker-rseidelsohn (actively-maintained fork of
    # davglass/license-checker) — `--onlyAllow` takes a semicolon-separated
    # list and exits non-zero on the first non-matching license, which makes
    # the CI step a one-liner.
    #
    # Scope: --production drops devDependencies (tests / build tooling never
    # ship to the customer). --excludePrivatePackages drops the project
    # itself (`rumi-restaurant-web` is marked UNLICENSED — private).
    #
    # To add a license: see the header in `LICENSES.allowlist`. Adding a
    # license is intentionally a code change so the diff is auditable.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Install license-checker-rseidelsohn (pinned)
        run: npm install --global --no-save --ignore-scripts license-checker-rseidelsohn@4.3.0
      - name: Build --onlyAllow + --excludePackages lists (strip comments + blank lines)
        # Both repo-tracked files are kept in the human-friendly
        # one-per-line + `#` comments format; the tool needs single
        # semicolon-separated strings. Whitespace around each entry is
        # preserved verbatim (compound strings like `MIT AND ISC` contain
        # spaces that are part of the license identifier).
        #
        # LICENSES.excluded.txt scopes per-package exceptions for native
        # binaries with copyleft upstream licenses whose obligations
        # don't attach in our usage pattern (server-side dynamic linking,
        # no modification, no redistribution of modified binaries).
        # See the header of that file for policy + rationale.
        run: |
          ALLOWED=$(grep -v '^#' LICENSES.allowlist | grep -v '^$' | paste -sd';' -)
          EXCLUDED=$(grep -v '^#' LICENSES.excluded.txt | grep -v '^$' | paste -sd';' -)
          echo "Allowed licenses: $ALLOWED"
          echo "Excluded packages: $EXCLUDED"
          echo "ALLOWED_LICENSES=$ALLOWED" >> "$GITHUB_ENV"
          echo "EXCLUDED_PACKAGES=$EXCLUDED" >> "$GITHUB_ENV"
      - name: Scan licenses
        run: |
          license-checker-rseidelsohn \
            --production \
            --excludePrivatePackages \
            --excludePackages "$EXCLUDED_PACKAGES" \
            --onlyAllow "$ALLOWED_LICENSES" \
            --summary

  # Playwright HIGH-tier E2E suite. Brings up Postgres + Mailpit as service
  # containers, runs the backend from its PUBLISHED GHCR image (pinned to the
  # `sha-` tag of backend develop HEAD; it migrates + seeds itself on startup),
  # applies a tiny SQL seed on top, then runs `npm run test:e2e`. See
  # docs/E2E-STRATEGY.md §CI for the design rationale; tracked in frontend #37.
  playwright_e2e:
    name: playwright (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SHARDED (2026-08-17). Measured on run 31981952315 (warm caches): the job
    # took 256s, of which only ~86s is fixed setup (containers 24s, checkout +
    # node 6s, npm ci 22s, backend pull + health 16s, browser cache 7s) and
    # ~170s is `npm run test:e2e` (13s dev-server boot + ~157s of 45 tests on 2
    # workers). Because the tests dominate the floor ~2:1, splitting them across
    # two runners that each re-pay the floor still wins: 86 + 13 + ~79 = ~178s,
    # i.e. ~78s off the wall clock for ~2x the runner minutes. NOTHING IS
    # SKIPPED — `--shard=i/2` partitions the same 45 tests, and the aggregate
    # `playwright_e2e_result` job below is red unless BOTH shards are green.
    #
    # Isolation: shards are separate jobs, so each gets its OWN postgres/redis/
    # mailpit service containers, its own dev server and its own seeded
    # database — no cross-shard contamination is possible. (globalTeardown
    # deliberately does not purge users for exactly this reason.)
    #
    # CONFIRMED on run 32012215749: the shards took 158s and 122s (the split is by
    # test COUNT, not duration, so they are uneven) and this workflow's wall clock
    # went 265s -> 163s. That is the full gain on a `develop` push, where ci.yml is
    # the entire gate. On a PULL REQUEST it buys nothing today: the separate
    # `Screenshots` workflow is the critical path at ~279s, so the PR waits on that
    # either way.
    #
    # Do not raise the shard count without re-measuring: at 4 shards each leg
    # would run ~40s of tests against a ~99s floor, so the wall clock stops
    # improving while the runner bill keeps doubling.
    #
    # SHARDING THE SCREENSHOT SUITE WAS TRIED HERE AND REJECTED (same day, run
    # 32012215727). Its legs are floor-dominated, not test-dominated: of a 274s
    # leg, ~181s is fixed (74s job setup + 24s `docker pull` of the pinned
    # Playwright image + 83s of `rm -rf .next && next build`) and only 92s is
    # tests. Two shards measured 206/259s (classic) and 195/256s (craft) — the
    # count-based split landed 26s of tests in one shard and 74s in the other — so
    # the workflow wall clock went 278s -> 279s: ZERO gain for double the runner
    # minutes. Do not retry it until that floor is cut (share one `next build`
    # across the legs, keep the Playwright image warm); the floor, not the test
    # time, is where the PR's remaining minutes are.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123 # pragma: allowlist secret
          POSTGRES_DB: restaurantdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.29.7
        ports:
          - 1025:1025
          - 8025:8025
      # Required by Aspire's AddRedisDistributedCache("redis") in backend
      # Program.cs — the e2e backend runs as a real process and tries to
      # connect on startup. SHA-pinned to redis:7.4-alpine.
      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 # 7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Backend runtime config (read via .AddEnvironmentVariables() —
      # double-underscore = nested key per .NET convention)
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5221
      # Aspire integration reads ConnectionStrings:restaurantdb (Npgsql) and
      # ConnectionStrings:redis (RedisDistributedCache). See backend Program.cs:
      # builder.AddNpgsqlDataSource("restaurantdb") + builder.AddRedisDistributedCache("redis").
      ConnectionStrings__restaurantdb: Host=localhost;Port=5432;Database=restaurantdb;Username=postgres;Password=postgres123 # pragma: allowlist secret
      ConnectionStrings__redis: localhost:6379
      JwtSettings__Secret: e2e-only-jwt-secret-not-for-production-at-least-32-chars-long-padding-padding # pragma: allowlist secret
      JwtSettings__Issuer: rumi-e2e
      JwtSettings__Audience: rumi-e2e
      EmailSettings__SmtpHost: localhost
      EmailSettings__SmtpPort: '1025'
      EmailSettings__EnableSsl: 'false'
      EmailSettings__UseAuthentication: 'false'
      EmailSettings__Username: e2e
      EmailSettings__Password: e2e # pragma: allowlist secret
      EmailSettings__FromEmail: noreply@test.local
      EmailSettings__FromName: RUMI E2E
      EmailSettings__AdminEmail: e2e-admin@test.local
      EmailSettings__FrontendBaseUrl: http://localhost:3000
      EmailSettings__BackendBaseUrl: http://localhost:5221
      CorsSettings__AllowedOrigins__0: http://localhost:3000
      # Frontend / Playwright config
      E2E_API_BASE_URL: http://localhost:5221
      E2E_BASE_URL: http://localhost:3000
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_DATABASE_URL: postgres://postgres:postgres123@localhost:5432/restaurantdb # pragma: allowlist secret
      NEXT_PUBLIC_API_URL: http://localhost:5221
    steps:
      - name: Checkout frontend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      # The backend is PULLED, not compiled (2026-08-17, CI-PERFORMANCE-PLAN
      # §2). This job used to check the backend repo out at `ref: develop` and
      # `dotnet build` it: 73-84s for the build + 9-11s for `dotnet ef` + 7-9s
      # for setup-dotnet + 7s of NuGet cache restore, on every one of the three
      # backend-bearing legs a frontend PR runs (this job + two screenshot
      # templates). build-image.yml publishes the identical develop code to
      # GHCR on every develop push, tagged both `sha-<commit>` and `:staging`;
      # the image is 110MB compressed.
      #
      # Staleness, stated honestly: we resolve backend develop HEAD and pull
      # that exact `sha-` tag, so the normal case is the same commit the old
      # checkout compiled. Only when the image for that commit does not exist
      # yet (build-image.yml still running, i.e. the first few minutes after a
      # backend merge) do we fall back to `:staging`, the previous develop
      # build — one merge stale, and announced with a ::warning:: annotation so
      # a surprising red is traceable in the log. Note the old step was already
      # a moving target: `ref: develop` never tested the PR against a matched
      # or unmerged backend either.
      - name: Resolve backend image (develop HEAD, else :staging)
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          IMAGE=ghcr.io/piwas-21/restaurant-app-backend
          SHA=$(gh api repos/piwas-21/restaurant-app-backend/commits/develop --jq .sha)
          echo "backend develop HEAD: $SHA"
          if docker pull -q "$IMAGE:sha-$SHA"; then
            echo "BACKEND_IMAGE=$IMAGE:sha-$SHA" >> "$GITHUB_ENV"
          else
            echo "::warning::No published image for backend develop HEAD ($SHA) yet — build-image.yml has probably not finished. Falling back to :staging (the previous develop build, one merge stale)."
            docker pull -q "$IMAGE:staging"
            echo "BACKEND_IMAGE=$IMAGE:staging" >> "$GITHUB_ENV"
          fi

      # No `dotnet ef database update` step: the app applies its own migrations
      # and runs its entity seeders on startup (Program.cs ->
      # MigrateApplicationDatabaseAsync), which is exactly how it comes up on a
      # box. --network host so the container reaches the postgres/redis
      # service containers on localhost and the suite reaches the API on
      # localhost:5221. The env file is the job-level backend config, filtered
      # by prefix — the same variables `dotnet run` used to inherit.
      - name: Start backend (published image)
        run: |
          env | grep -E '^(ASPNETCORE_|ConnectionStrings__|JwtSettings__|EmailSettings__|CorsSettings__)' > /tmp/backend.env
          docker run -d --name rumi-backend --network host --env-file /tmp/backend.env "$BACKEND_IMAGE"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://localhost:5221/api/health >/dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend never came up. Last 200 log lines:"
          docker logs --tail 200 rumi-backend || true
          exit 1

      # AFTER the backend is up, because the schema now arrives with the app's
      # startup migration rather than a build-time `dotnet ef` step. Safe in
      # that order: the seed is idempotent (fixed UUIDs + ON CONFLICT DO
      # NOTHING) and the startup seeders write disjoint rows.
      - name: Seed test data
        env:
          PGPASSWORD: postgres123 # pragma: allowlist secret
        run: |
          psql -h localhost -U postgres -d restaurantdb \
            -v ON_ERROR_STOP=1 -f e2e/seed/seed.sql

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # Both go through package.json scripts, not `npx`: the local binary is
      # the lockfile-pinned @playwright/test, and a missing one must fail the
      # job rather than have npx pull an unpinned release off the registry.
      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:install

      - name: Verify cached Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        # Cheap no-op on a good cache (the binary is already under
        # ~/.cache/ms-playwright); re-downloads if the archive was partial, so a
        # corrupt cache degrades to the cold path instead of a failed suite. The
        # `--with-deps` apt step is skipped: the OS libs it installs are not in
        # the cache, but ubuntu-latest already ships chromium's runtime libs and
        # the cold path proves them sufficient every time it runs.
        run: npm run test:e2e:install:verify

      # SHARD_INDEX comes from the hardcoded matrix literal (trusted), passed via
      # env rather than interpolated into the script (githubactions:S8264 shape).
      - name: Run Playwright tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: npm run test:e2e -- "--shard=${SHARD_INDEX}/2"

      # Log dump BEFORE the container is removed — `docker rm -f` would take
      # the logs with it.
      - name: Dump backend log on failure
        if: failure()
        run: docker logs --tail 300 rumi-backend || true

      - name: Stop backend
        if: always()
        run: docker rm -f rumi-backend 2>/dev/null || true

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: playwright-report-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Aggregate gate carrying the EXACT branch-protection check name. The ruleset
  # requires a single context "playwright (e2e)", but the sharded matrix suffixes
  # its per-leg checks with "(1)"/"(2)". This job restores the stable required
  # name and passes iff EVERY shard passed — so the required check tracks the
  # shard count without a ruleset edit. Same shape as screenshots.yml's
  # `screenshots_result`.
  #
  # `if: always()` + an explicit equality test on the matrix result is what makes
  # a cancelled or skipped shard read as FAILURE rather than as green: `result` is
  # "success" only when every leg succeeded, and any other value exits 1.
  playwright_e2e_result:
    name: playwright (e2e)
    if: always()
    needs: playwright_e2e
    runs-on: ubuntu-latest
    # Reads only the matrix result from the `needs` context — no repo access.
    permissions: {}
    steps:
      - name: Gate on shard results
        env:
          RESULT: ${{ needs.playwright_e2e.result }}
        run: |
          echo "e2e shard matrix result: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::an e2e shard did not pass"; exit 1; }

# OSV-Scanner config (read automatically by the CI scan of package-lock.json).
# Accepted findings only — anything with a reachable patched version gets fixed,
# not listed here. Mirrors .npm-audit-allowlist.json, which carries the same
# entries for the `npm audit` gate; keep the two in step.
#
# Currently EMPTY, and the entry that used to be here is worth remembering.
# GHSA-mh99-v99m-4gvg (brace-expansion DoS) was accepted on the grounds that the
# advisory had "no back-ported fix (single range, fixed: 5.0.8)" and that forcing
# v5 broke eslint's minimatch@3 (#297, reverted by #302). That reason has since
# EXPIRED: the advisory now carries fixes for every range — 1.1.17, 2.1.3, 3.0.3
# and 5.0.8 — so a patch-level bump inside each existing major clears it without
# touching minimatch@3 at all. Removed rather than left to sit until its
# 2026-10-31 expiry, because an ignore is a claim about the world and this one
# had stopped being true. An "unused ignores" warning from osv-scanner is the
# tell; it does not fail the build, so nothing would have raised it on its own.

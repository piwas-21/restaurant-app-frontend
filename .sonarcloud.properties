# SonarCloud automatic-analysis config (supported-key subset only).
#
# CPD (copy-paste detection) exclusions — added 2026-07-11 with S15 T3 slice 2
# (PR #171): classic/chrome/CustomerChrome.tsx is a DELIBERATE verbatim fold of
# app-internal-layout.tsx's customer path, and RoleNavLinks.tsx a verbatim
# extraction of its renderNavLinks(). That duplication is the mechanism that
# guarantees zero visual delta on live prod (screenshot-suite gated): the shared
# staff/admin chrome must stay byte-identical while templates own the customer
# chrome. The T4 chrome consolidation (SOFRA-TENANT-TEMPLATES-PLAN) removes the
# duplication — DELETE these entries at T4.
#
# src/design-system/palettes/presets.ts (ADR-007, 2026-07-18): a curated TABLE of
# colour palettes that share an identical token shape by construction (each = a
# brand triad + link + on-primary over the same neutral base). CPD normalises the
# differing hex literals and flags the repeated shape as duplication — a false
# positive on a data table, not copy-pasted logic. Permanent (the table grows as
# palettes are added); an AA-contrast unit test, not CPD, guards this file.
#
# jest.config.js (2026-07-24, FLOOR-PLAN-REVAMP S6): the per-file coverageThreshold
# TABLE — every fully-covered file gets the identical `{ statements: 99, branches:
# 99, functions: 99, lines: 99 }` floor by design, so CPD flags the repeated block
# as duplication. A false positive on a config table, not copy-pasted logic;
# permanent (the table grows as tested files are added). It surfaced on the small
# S6 lib PR where the table is a large fraction of the diff.
sonar.cpd.exclusions=src/templates/classic/chrome/CustomerChrome.tsx,src/components/RoleNavLinks.tsx,src/design-system/palettes/presets.ts,jest.config.js

# ⚠️ Do NOT add `sonar.issue.ignore.multicriteria` here — it does not work.
#
# This project runs SonarCloud AUTOMATIC analysis (`sonar.autoscan.enabled=true`),
# which ingests only the supported-key subset named at the top of this file.
# `sonar.issue.ignore.*` is a scanner-side property and is silently dropped:
# tried on 2026-07-27 for typescript:S1607 over `e2e/**` (PR #326), and the 15
# issues were still open on the next analysis while a real S4624 fixed in the
# same commit did clear — proving the analysis re-ran and simply ignored the key.
# `api/settings/values` confirms it never reaches the project.
#
# The working route for a rule-level false positive is to transition the issues
# to *accepted* with a rationale comment (workspace CLAUDE.md rule 2c). That is
# what was done for the S1607s: Playwright's `test.skip(condition, reason)` is a
# RUNTIME conditional skip carrying a mandatory reason — the opposite of a
# disabled test — and it is how the order-type-availability suite states in its
# report that a given environment could not demonstrate a scenario.

# RUMI Frontend — pre-commit configuration
# Install:        pre-commit install && pre-commit install --hook-type pre-push
# Update hooks:   pre-commit autoupdate
# Run manually:   pre-commit run --all-files
#
# Sprint 1: hygiene + secret scanning.
# Sprint 2:   prettier --check.
# Sprint 2.5: tsc --noEmit, eslint --max-warnings=0.
# See docs/QUALITY-SECURITY-PLAN.md.

repos:
  # ── General hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|patch)$
      - id: end-of-file-fixer
        exclude: \.(svg|patch)$
      - id: check-yaml
        # GitLab CI YAML uses extensions that the default parser rejects
        args: ["--unsafe"]
      - id: check-json
        # Skip files that legitimately hold credentials placeholders
        exclude: "(secrets|credentials|service-account)\\.json"
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        # RUMI's hero photo is a pre-existing tracked blob that MOVED out of the shared
        # default set (public/branding/) into its own tenant set, so the hook sees an add.
        # Already re-encoded RGB-lossless (1762 -> 1297 KB, pixel-identical); the remainder
        # is a 2001x798 photograph, and degrading a tenant's own artwork to satisfy a
        # rename false-positive is the wrong trade. Scoped to this one path on purpose.
        exclude: ^public/branding-rumi/hero\.png$
      - id: no-commit-to-branch
        # `master` included defensively in case of accidental rename / fork.
        args: ["--branch", "main", "--branch", "develop", "--branch", "master"]

  # ── Secret scanning ──────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Single source of truth for known false positives is .secrets.baseline.
        # Don't add path excludes here — they hide rows the baseline already
        # captures, leaving the team without visibility when new "secrets"
        # appear in those paths. Prefer regenerating the baseline:
        #   detect-secrets scan --baseline .secrets.baseline
        args: ["--baseline", ".secrets.baseline"]

  # ── Sprint 2: format gate ────────────────────────────────────────────
  # Verifies staged files are prettier-clean. To fix: `npm run format`
  # and re-stage. Runs only when a relevant file is in the commit.
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier --check
        entry: npx prettier --check
        language: system
        files: ^src/.*\.(ts|tsx|css|json|md)$
        exclude: ^src/locales/.*\.json$

  # ── Sprint 2.5: typecheck gate ───────────────────────────────────────
  # Runs `tsc --noEmit` whenever a .ts/.tsx file is staged. Whole-project
  # check (no incremental) — catches cross-file type breakage that
  # affects-only-staged-files lint can't see.
  - repo: local
    hooks:
      - id: tsc-noemit
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      - id: eslint
        name: eslint (--max-warnings=0)
        entry: npm run lint --silent
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|mjs|cjs)$

  # ── Pre-push: affected-test gate ─────────────────────────────────────
  # Runs Jest --findRelatedTests on .ts/.tsx/.js/.jsx files changed vs
  # origin/develop. Catches the common-case unit-test regressions before CI
  # without paying the full `npm test` cost on every push. Playwright E2E is
  # NOT included (too slow for a pre-push gate). See CLAUDE.md §7.
  - repo: local
    hooks:
      - id: jest-affected
        name: jest --findRelatedTests (changed files vs origin/develop)
        entry: bash scripts/test-affected.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # ── Sprint 2: file-length gate ───────────────────────────────────────
  # Enforces the per-file LOC limits from CLAUDE.md §4. Existing oversized
  # files are grandfathered in scripts/file-length-baseline.txt; new
  # violations block. See scripts/check-file-length.sh for limits + opt-out.
  # Per-file mode: pre-commit passes the staged paths.
  - repo: local
    hooks:
      - id: file-length
        name: file-length (CLAUDE.md §4 limits)
        entry: bash scripts/check-file-length.sh
        language: system
        files: \.(ts|tsx|module\.css)$
        exclude: \.(test|spec|stories)\.(ts|tsx)$

  # ── E9: bare-catch ratchet ───────────────────────────────────────────
  # `} catch {` discards the thrown ApiError, and with it the server's own
  # per-rule messages — the defect BUGS-IMPROVEMENTS-PLAN E9 reports. The sweep
  # runs feature area by feature area, so this is a RATCHET on the count rather
  # than a ban: it may only go down. Whole-tree, so it runs regardless of which
  # files are staged — a count is not a per-file property.
  - repo: local
    hooks:
      - id: bare-catch
        name: bare-catch ratchet (E9)
        entry: node scripts/check-bare-catch.mjs
        language: system
        pass_filenames: false
        always_run: true

  # ── E8: physical-CSS ratchet ─────────────────────────────────────────
  # `margin-left` and friends do not follow `dir`, so they land on the wrong
  # side of their own text once `ar` mirrors the layout. Same shape as the
  # bare-catch ratchet above and for the same reason: the sweep runs feature
  # area by feature area, so the count may only go down. Whole-tree.
  - repo: local
    hooks:
      - id: physical-css
        name: physical-CSS ratchet (E8)
        entry: node scripts/check-physical-css.mjs
        language: system
        pass_filenames: false
        always_run: true

  # A class that `composes` a base from another file and re-declares one of that base's own
  # properties ties on specificity, so the winner is chunk order (#447). Unlike the two
  # ratchets above this is a HARD zero — the 16 pre-existing cases were all fixed in the PR
  # that added the gate, so there is no baseline to carry. Whole-tree, and it FAILS if its
  # own corpus disappears: a green run prints the file/edge counts it examined.
  - repo: local
    hooks:
      - id: composes-overrides
        name: composes override determinism (#447)
        entry: node scripts/check-composes-overrides.mjs
        language: system
        pass_filenames: false
        always_run: true

  # NOTHING else in CI parses CSS. A comment that loses its opening `/*` leaves English prose
  # where selectors go, and prose is VALID CSS — prettier reformats it as selectors and calls the
  # file clean, tsc/eslint/jest never look, and the browser is the first thing to object, with a
  # 500. So this asserts something stronger than "it parses": every type selector must name a real
  # element. Hard zero, whole-tree, and it fails if its own corpus disappears.
  - repo: local
    hooks:
      - id: css-selectors
        name: CSS selectors are selectors (§6.11)
        entry: node scripts/check-css-selectors.mjs
        language: system
        pass_filenames: false
        always_run: true

  # `styles.x` where the stylesheet declares no `.x`. Nothing else can see it: identity-obj-proxy
  # makes every `styles.x` truthy in jest, Next types a module as an index signature so tsc is
  # clean for any key, and React omits an attribute whose value is `undefined` so there is no DOM
  # telltale either — reading the stylesheet is the only check that can fail. Baselined at 65
  # (10 of them inside a template literal, where `undefined` STRINGIFIES and the element really
  # does serve `class="… undefined"`); the baseline may only shrink, and those 10 are named on
  # every green run so they cannot quietly become permanent.
  - repo: local
    hooks:
      - id: css-module-bindings
        name: CSS-module bindings resolve (§6.2)
        entry: node scripts/check-css-module-bindings.mjs
        language: system
        pass_filenames: false
        always_run: true

<div class="w-full max-w-[390px] min-h-[844px] flex flex-col relative shadow-2xl bg-app-dark overflow-hidden">
<!-- TopNavBar (From JSON) -->

</div>

<button class="absolute bottom-4 right-4 w-9 h-9 rounded-full bg-primary-container text-on-primary shadow-md flex items-center justify-center hover:bg-primary transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</article>

# OSV-Scanner config (read automatically by the CI scan of package-lock.json).
# Accepted findings only — anything with a reachable patched version gets fixed,
# not listed here. Mirrors .npm-audit-allowlist.json, which carries the same
# entries for the `npm audit` gate; keep the two in step.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-10-31
# brace-expansion: DoS via unbounded expansion. BUILD-TIME glob matcher only —
# never shipped to the browser, and it only ever expands patterns we author, so
# there is no untrusted input path. The advisory has NO back-ported fix (single
# range, fixed: 5.0.8) and brace-expansion@5 changed its export from a function
# to an object, which breaks minimatch@3 — a direct dependency of eslint itself.
# #297 forced the major and silently broke every `eslint` invocation that used a
# brace glob; #302 reverted that and accepted the finding here instead.
# Revisit when eslint moves off minimatch@3, or at the ESLint-CLI migration.
reason = "Build-time only, no untrusted input, no back-ported fix; forcing v5 breaks eslint's minimatch@3 (see #297/#302)."

name: build-tenant-image

# The image tag in the run's title. Two reasons, one human and one load-bearing:
# N dispatched tenant builds otherwise render as N identical rows in the Actions list,
# and the deploy repo's provision-on-registry-merge chain identifies the run it just
# dispatched by matching this title (the runs API exposes no workflow inputs, and
# "newest dispatch since I asked" is ambiguous once two tenant builds overlap).
# Keep the tag in this string.
run-name: build-tenant-image ${{ inputs.image_tag }}

# Builds a PER-TENANT frontend image for Sofra instance-per-tenant provisioning
# (sofra ADR-001/ADR-003; deploy repo provision-tenant.sh pulls the result).
#
# WHY a separate image per tenant: NEXT_PUBLIC_* are baked into the bundle at
# BUILD time (Next.js), so each tenant domain needs its own bake of the SAME
# source — this is the staging-image pattern (build-image.yml build-staging)
# generalised to an on-demand workflow_dispatch. The prod :latest chain is
# untouched; this is deliberately a SEPARATE workflow file so deploy.yml's
# workflow_run trigger (which matches build-image by name) never fires from a
# tenant build.
#
# Usage (founder-run today; the control plane calls the same entry point later):
#   gh workflow run build-tenant-image.yml -f tenant_domain=demo.sofrapiwas.com -f image_tag=tenant-demo
# Publishes ghcr.io/piwas-21/restaurant-app-frontend:<image_tag> (moving) plus
# :<image_tag>-sha-<commit> (immutable, for rollback), built from the ref the
# workflow is dispatched on (normally main).
#
# Security: same posture as build-image.yml — no untrusted-input expressions
# inlined in any run: step (inputs appear in `with:` blocks, or — for
# branding_url only — are passed via `env:` into the script and validated;
# dispatch is restricted to users with write access anyway); all third-party
# actions pinned to immutable SHAs; token is the workflow-scoped GITHUB_TOKEN
# with packages:write only.

on:
  workflow_dispatch:
    inputs:
      tenant_domain:
        description: "Tenant's public domain (no scheme), e.g. demo.sofrapiwas.com"
        required: true
      image_tag:
        description: "GHCR tag to publish, e.g. tenant-demo (convention: tenant-<registry slug>)"
        required: true
      google_client_id:
        description: "Google OAuth web client id for this tenant ('' disables Google login; the shared client only allows registered JS origins)"
        required: false
        default: ""
      restaurant_name:
        description: "Tenant display name baked into page metadata (registry `name`, e.g. Demo Restaurant). Empty = neutral 'Restaurant' title — pass it for any real tenant"
        required: false
        default: ""
      branding_url:
        description: "HTTPS URL of a .tar.gz branding archive extracted into public/branding/ before the build (files at archive root: icon.svg, icon-192.png, icon-512.png, icon-maskable-512.png, hero.png, placeholder.png). An archive with icon.svg but not all three PNGs FAILS the build — the PNGs are the installed app's home-screen icon. NO logo — since O6 the logo is runtime data uploaded in tenant admin. Empty = SofraPiwas default assets"
        required: false
        default: ""
      branding_dir:
        description: "Repo-relative dir of committed branding assets (same filenames and same icon-set rule as branding_url) copied into public/branding/ before the build. Alternative to branding_url (no download); empty = none"
        required: false
        default: ""
      template:
        description: "UI template baked into the bundle (registry `template:` field, ADR-006): classic | craft"
        required: false
        default: "classic"
      currency:
        description: "ISO 4217 currency code baked into price formatting (registry `currency:` field, deploy repo; pairs with backend LocalizationSettings.Currency), e.g. CHF, EUR"
        required: false
        default: "CHF"
      locale:
        description: "BCP-47 locale that places/punctuates the price (registry `locale:` field, deploy repo): de-CH renders 'EUR 8.00', fr-FR renders '8,00 €'"
        required: false
        default: "de-CH"
      pwa_theme_color:
        description: "Web app manifest theme_color, #rrggbb (browser/OS chrome around the installed app). EMPTY DEFAULTS TO RUMI RED #c00000 — pass it for any tenant with another palette"
        required: false
        default: ""
      pwa_background_color:
        description: "Web app manifest background_color, #rrggbb (splash screen while the installed app boots). EMPTY DEFAULTS TO #ffffff"
        required: false
        default: ""
      source_ref:
        description: "Commit SHA / branch / tag to BUILD FROM. Empty = the ref this run was dispatched on. Pass the released SHA from a workflow_run caller, which would otherwise get the default branch"
        required: false
        default: ""
  # Reusable entry point (same inputs, typed) so an automated caller can rebuild a
  # tenant image from the caller's ref without duplicating the build logic — used by
  # build-demo-tenant.yml to rebuild tenant-demo from develop-tip on every develop push
  # (demo.sofrapiwas.com = craft staging). GITHUB_TOKEN reaches same-repo reusable
  # workflows automatically; the caller must grant packages:write.
  workflow_call:
    inputs:
      tenant_domain:
        description: "Tenant's public domain (no scheme), e.g. demo.sofrapiwas.com"
        required: true
        type: string
      image_tag:
        description: "GHCR tag to publish, e.g. tenant-demo"
        required: true
        type: string
      google_client_id:
        description: "Google OAuth web client id ('' disables Google login)"
        required: false
        default: ""
        type: string
      restaurant_name:
        description: "Tenant display name baked into page metadata"
        required: false
        default: ""
        type: string
      branding_url:
        description: "HTTPS URL of a .tar.gz branding archive (empty = repo defaults)"
        required: false
        default: ""
        type: string
      branding_dir:
        description: "Repo-relative dir of committed branding assets — icon.svg, the three manifest PNGs, hero.png, placeholder.png (alternative to branding_url; empty = none)"
        required: false
        default: ""
        type: string
      template:
        description: "UI template baked into the bundle: classic | craft"
        required: false
        default: "classic"
        type: string
      currency:
        description: "ISO 4217 currency code, e.g. CHF, EUR"
        required: false
        default: "CHF"
        type: string
      locale:
        description: "BCP-47 locale for price formatting, e.g. de-CH, fr-FR"
        required: false
        default: "de-CH"
        type: string
      pwa_theme_color:
        description: "Manifest theme_color #rrggbb; empty defaults to RUMI red #c00000"
        required: false
        default: ""
        type: string
      pwa_background_color:
        description: "Manifest background_color #rrggbb; empty defaults to #ffffff"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Commit SHA / branch / tag to BUILD FROM. Empty = the ref this run is on — which for a workflow_run caller is the DEFAULT BRANCH, not what the upstream run built"
        required: false
        default: ""
        type: string

concurrency:
  group: build-tenant-${{ inputs.image_tag }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build & push tenant image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # EMPTY = the ref this workflow is running on, which is the historical
          # behaviour and what a `gh workflow run --ref X` dispatch already gives you.
          #
          # It is NOT good enough for a `workflow_run` CALLER, which is why this input
          # exists. A `workflow_run`-triggered workflow — and every reusable workflow it
          # `uses:` — is loaded and checked out from the repository's DEFAULT BRANCH,
          # `develop` under GitFlow, regardless of what the upstream run built. So
          # release-tenant-images.yml, chained off a `build-image` on `main`, would build
          # every tenant's bundle from DEVELOP TIP. Measured on the chain's first live run
          # (2026-08-30, run 33333231945): the tenant image was stamped `4133311` (develop)
          # while prod's own image was `9ea3749` (the main merge commit). Harmless that
          # day only because the two trees were byte-identical
          # (`git rev-parse 4133311a^{tree} == 9ea3749a^{tree}`, both ddb6ddd) — i.e. the
          # release had just landed and develop had not moved. One merge to develop in that
          # window and every tenant would have been shipped UNRELEASED code, silently, by
          # the workflow whose whole purpose is to ship RELEASED code.
          #
          # Same family as the `schedule:` trap: it is not the trigger's ref that decides,
          # it is the default branch.
          ref: ${{ inputs.source_ref }}

      - name: Validate template input
        # Allowlist mirrors the registry contract (deploy repo registry.yml
        # `template:` values, ADR-006). NOTE: `craft` is accepted here per
        # that contract but FAILS the Docker build until T3 ships
        # src/templates/craft/ (next.config.ts aborts on a missing template
        # dir). Input is operator-supplied (workflow_dispatch, write access
        # required); still passed via env, never inlined in the script.
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          case "$TEMPLATE" in
            classic|craft) ;;
            *) echo "template must be 'classic' or 'craft', got: '$TEMPLATE'" >&2; exit 1 ;;
          esac

      - name: Validate currency input
        # Mirrors the src/lib/config.ts validation (3-letter uppercase ISO
        # 4217 code). An invalid code would silently fall back to CHF inside
        # the bundle, so fail the build loudly here instead. Input is
        # operator-supplied (workflow_dispatch, write access required); still
        # passed via env, never inlined in the script.
        env:
          CURRENCY: ${{ inputs.currency }}
        run: |
          if ! printf '%s\n' "$CURRENCY" | grep -Eq '^[A-Z]{3}$'; then
            echo "currency must be a 3-letter uppercase ISO 4217 code, got: '$CURRENCY'" >&2
            exit 1
          fi

      - name: Validate locale input
        # Mirrors the src/lib/config.ts fallback (Intl.getCanonicalLocales).
        # An invalid tag would silently fall back to de-CH inside the bundle and
        # ship a French tenant Swiss price formatting, so fail loudly here.
        # Input is operator-supplied (workflow_dispatch, write access required);
        # still passed via env, never inlined in the script.
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          node -e '
            const raw = (process.env.LOCALE ?? "").trim();
            try {
              const [canonical] = Intl.getCanonicalLocales(raw);
              if (!canonical) throw new Error("empty");
              console.log("locale ok: " + canonical);
            } catch {
              console.error("locale must be a valid BCP-47 tag (e.g. de-CH, fr-FR), got: " + JSON.stringify(raw));
              process.exit(1);
            }
          '

      - name: Validate PWA colour inputs
        # These two land verbatim in the web app manifest, so a malformed value
        # would ship a broken/ignored colour rather than fail. Empty is legal and
        # means "keep the src/lib/config.ts default" — which is RUMI RED
        # (#c00000) / white, the classic template's palette. That default is the
        # reason this input exists at all: a tenant with another palette that
        # never passes these gets RUMI's red around their installed app.
        env:
          PWA_THEME: ${{ inputs.pwa_theme_color }}
          PWA_BG: ${{ inputs.pwa_background_color }}
        run: |
          for v in "$PWA_THEME" "$PWA_BG"; do
            if [ -n "$v" ] && ! printf '%s\n' "$v" | grep -Eq '^#[0-9a-fA-F]{6}$'; then
              echo "pwa colours must be #rrggbb, got: '$v'" >&2
              exit 1
            fi
          done

      - name: Apply tenant branding overrides
        # Replaces the repo-default branding assets in public/branding/ with
        # the tenant's own set BEFORE the Docker build, so a tenant image
        # carries its own icons/hero/favicon without a repo change (#125).
        # Expected archive layout (.tar.gz, files at the archive ROOT):
        #   icon.svg               — favicon + manifest vector icon
        #   icon-192.png           — manifest install icon (purpose "any")
        #   icon-512.png           — manifest install icon (purpose "any")
        #   icon-maskable-512.png  — manifest install icon (purpose "maskable")
        #   hero.png               — home-page hero background
        #   placeholder.png        — menu-item "no photo" fallback
        # The three PNGs are what a phone puts on the HOME SCREEN
        # (src/app/manifest.ts). They were missing from this list until now, so a
        # tenant that shipped its own icon.svg got its own favicon and the
        # SofraPiwas onion on the installed app. An archive that carries icon.svg
        # without all three now FAILS the build rather than shipping that mix —
        # rationale in scripts/apply-tenant-branding.sh.
        # Only these filenames are copied (no arbitrary extraction into the
        # workspace); a file missing from the archive keeps the repo default.
        # The repo defaults are the SofraPiwas platform set (they used to be
        # tenant-1's, which is how every self-serve tenant ended up with RUMI's
        # hero photo); a tenant overrides any of them via branding_url or a
        # committed branding_dir. The LOGO is deliberately absent from this list:
        # since O6 it is runtime data on RestaurantInfo, uploaded in tenant admin,
        # so baking one would be a second source of truth that silently wins.
        # Security: input is operator-supplied (workflow_dispatch, write
        # access required); still passed via env — never inlined in the
        # script — quoted, and required to start with https://.
        if: inputs.branding_url != ''
        env:
          BRANDING_URL: ${{ inputs.branding_url }}
        run: |
          set -euo pipefail
          case "$BRANDING_URL" in
            https://*) ;;
            *) echo "branding_url must start with https://" >&2; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          curl --fail --silent --show-error --location --max-time 60 \
            --output "$tmp/branding.tar.gz" "$BRANDING_URL"
          tar -xzf "$tmp/branding.tar.gz" -C "$tmp"
          ./scripts/apply-tenant-branding.sh "$tmp" "branding archive"

      - name: Apply committed branding dir
        # Alternative to branding_url for assets ALREADY committed in this repo
        # (e.g. a tenant set committed to this repo) — copies the same
        # filenames into public/branding/ before the Docker build, no download.
        # Same contract, same icon-set rule: both paths call one script so the
        # two can never drift again (they had, and that is how the install-icon
        # gap would have been fixed on one path only).
        # Security: the path is operator/caller-supplied → passed via env, quoted,
        # and rejected if absolute or containing '..' (no escape from the repo).
        if: inputs.branding_dir != ''
        env:
          BRANDING_DIR: ${{ inputs.branding_dir }}
        run: |
          set -euo pipefail
          case "$BRANDING_DIR" in
            /* | *..*) echo "branding_dir must be a repo-relative path without '..'" >&2; exit 1 ;;
          esac
          ./scripts/apply-tenant-branding.sh "$BRANDING_DIR" "branding_dir $BRANDING_DIR"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: buildmeta
        # ISO-8601 UTC build timestamp, and the commit that was ACTUALLY CHECKED OUT.
        #
        # `git rev-parse HEAD`, not `github.sha`, and the difference is the whole point of
        # this file's change: `github.sha` is the ref the RUN is on, which for a
        # `workflow_run` caller is the default branch and not the commit that was built.
        # Reading it off the working tree cannot drift from what the Docker build sees,
        # whatever `source_ref` was given — a SHA, a branch, a tag, or nothing at all.
        # /api/frontend/version is the instrument used to decide whether a tenant is on
        # the release, so a GIT_SHA that names a different commit than the bundle does not
        # merely mislabel the image, it disarms the only cheap way to check the fleet.
        # No workflow inputs are referenced here (see security note above).
        run: |
          set -euo pipefail
          {
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "building $(git rev-parse HEAD)"

      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The immutable rollback tag must name the BUILT commit for the same reason
          # GIT_SHA must: `type=sha` reads github.sha, so a workflow_run build would file
          # a main image under a develop SHA and the tag an operator picks for a rollback
          # would point at a commit that was never released. Same `<tag>-sha-<40hex>`
          # shape as before, derived from the checkout instead.
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=${{ inputs.image_tag }}-sha-${{ steps.buildmeta.outputs.sha }}
          # The OCI revision label needs the same correction as GIT_SHA and the rollback
          # tag above, and was the one place still left reading `github.sha`:
          # metadata-action derives `org.opencontainers.image.revision` from the ref the
          # RUN is on, which for a `workflow_run` caller is the DEFAULT branch. Measured
          # 2026-09-02 on the release of a3cb4370: kebabdilhan's image carried
          # `revision=09b6c125` — develop's tip — while the bundle it shipped was main's.
          # Harmless that day only because the release merge was content-free and the two
          # trees were identical; the moment develop moves ahead of main, an operator
          # reading `docker inspect` sees a plausible SHA that names code the tenant is
          # not running. Overriding it here wins over the auto-generated value.
          labels: |
            org.opencontainers.image.revision=${{ steps.buildmeta.outputs.sha }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ inputs.tenant_domain }}
            NEXT_PUBLIC_IMAGE_BASE_URL=https://${{ inputs.tenant_domain }}
            NEXT_PUBLIC_RESTAURANT_NAME=${{ inputs.restaurant_name }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ inputs.google_client_id }}
            NEXT_PUBLIC_TEMPLATE=${{ inputs.template }}
            NEXT_PUBLIC_TENANT_CURRENCY=${{ inputs.currency }}
            NEXT_PUBLIC_TENANT_LOCALE=${{ inputs.locale }}
            NEXT_PUBLIC_PWA_THEME_COLOR=${{ inputs.pwa_theme_color }}
            NEXT_PUBLIC_PWA_BACKGROUND_COLOR=${{ inputs.pwa_background_color }}
            GIT_SHA=${{ steps.buildmeta.outputs.sha }}
            BUILD_TIME=${{ steps.buildmeta.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Dependabot — SECURITY updates only (workspace CLAUDE.md standing decision:
# "Dependabot PRs are paused").
#
# `open-pull-requests-limit: 0` is the documented way to switch OFF version-update
# PRs while leaving Dependabot SECURITY updates fully on — which is why the file
# stays here instead of being deleted. The CVE gate is unchanged and, if anything,
# more load-bearing now: `npm audit (high+)`, `OSV-Scanner (dependency CVEs)`,
# retire.js, Trivy and gitleaks all still run as required checks / weekly scans.
#
# Why: the decision not to merge these PRs was already taken, but the bot was still
# being paid to open them — measured on this (private, billed) repo, 163 "Dependabot
# Updates" runs between 2026-07-07 and 2026-08-16, plus 24 full CI runs on
# dependabot/* branches in the last 8 days alone. Frontend CI is the workspace's most
# expensive suite (jest + playwright e2e + screenshots), so each of those PRs costs
# real runner-minutes for a PR that sits unmerged and rebasing. This makes the status
# quo honest rather than changing it. Version drift is the accepted cost, and it was
# already accruing. Sibling repos printer-app and deploy did the same.
#
# To resume version updates: raise the limits below (5 npm / 3 actions were the
# previous values) in a PR that also says who will triage them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Companion packages move with the trio (Gemini on frontend #141):
      # a @types/react major against an older react breaks tsc.
      # Majors of the framework trio are coordinated upgrades (CLAUDE.md §9 hard refusal).
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

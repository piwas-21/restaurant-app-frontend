name: Screenshots

# Visual-regression baseline comparison (S15 T1 close-out; the T2 gate for
# the tenant-templates plan — docs/plans/SOFRA-TENANT-TEMPLATES-PLAN.md in
# the workspace meta-repo).
#
# REQUIRED, NOT OPTIONAL: "playwright screenshots (visual baseline)" is in the
# `main-develop` ruleset's required status checks on both `main` and `develop`,
# so a red screenshots run BLOCKS the merge — never treat it as ignorable. The
# required name is produced by the aggregate `screenshots_result` job below,
# which passes iff EVERY matrix leg passed; the per-leg checks are suffixed with
# their matrix values — "(classic, 1)", "(craft, 2)", … (two templates x two test
# shards since 2026-08-17) — and are not individually required.
# Verify with: gh api repos/piwas-21/restaurant-app-frontend/rulesets
#
# Determinism: the Playwright step runs INSIDE the pinned
# mcr.microsoft.com/playwright image (tag = @playwright/test version from
# package-lock.json) with --network host, i.e. the exact environment
# `scripts/screenshots-docker.sh` uses to (re)generate baselines locally.
# Baselines are linux-only — see e2e/README.md §Screenshot baseline.
#
# The backend stack (postgres + redis services, the PUBLISHED backend image
# pulled from GHCR at backend develop HEAD, SQL seed) mirrors the
# playwright_e2e job in ci.yml. Mailpit is omitted: no screenshot page sends email.
#
# Security: no untrusted-input expressions in run: commands (the
# update_snapshots boolean input is passed via env). All third-party
# actions SHA-pinned. Minimal permissions, declared per job rather than
# workflow-wide (sonar githubactions:S8264). The npm install passes
# --ignore-scripts (githubactions:S6505) — see ci.yml's header for why
# that is safe for this lockfile.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate baselines (--update-snapshots) and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot_diff:
    name: playwright screenshots (visual baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # One leg per UI template (S15 T3 DoD): each builds with its own
    # NEXT_PUBLIC_TEMPLATE and compares against its own baseline segment.
    #
    # ...and SHARDED two ways per template since 2026-08-17, because this
    # workflow — not ci.yml — is the PR's critical path (measured on the same PR,
    # run 31981952294: Screenshots 278s wall vs CI 265s). Per-leg breakdown of the
    # 274s classic leg: 74s of job setup, then a 200s suite step that is 24s of
    # `docker pull` for the pinned Playwright image + 83s of `rm -rf .next && next
    # build` + 92s of 28 tests on 2 workers. So the floor is ~181s and the tests
    # ~92s: sharding buys ~47s per leg (181 + 46), not half the job. It is taken
    # anyway because nothing else shortens the binding path, but note the
    # asymmetry with ci.yml — here the floor dominates, so DO NOT go past 2
    # shards, and if the floor is ever cut (share one `next build` between the
    # legs; keep the Playwright image warm) re-measure whether sharding still pays
    # at all.
    #
    # NOTHING IS SKIPPED: `--shard=i/2` partitions the same 28 tests per template,
    # and `screenshots_result` below is red unless all four legs are green.
    # Isolation is free — each leg is its own job with its own postgres/redis
    # containers, its own production build on port 3100 and its own seeded DB.
    strategy:
      fail-fast: false
      matrix:
        template: [classic, craft]
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123 # pragma: allowlist secret
          POSTGRES_DB: restaurantdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Required by Aspire's AddRedisDistributedCache("redis") in backend
      # Program.cs. SHA-pinned to redis:7.4-alpine (same pin as ci.yml).
      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 # 7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Backend runtime config — mirrors ci.yml playwright_e2e, except the
      # allowed CORS origin: the screenshot production server listens on 3100.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5221
      ConnectionStrings__restaurantdb: Host=localhost;Port=5432;Database=restaurantdb;Username=postgres;Password=postgres123 # pragma: allowlist secret
      ConnectionStrings__redis: localhost:6379
      JwtSettings__Secret: e2e-only-jwt-secret-not-for-production-at-least-32-chars-long-padding-padding # pragma: allowlist secret
      JwtSettings__Issuer: rumi-e2e
      JwtSettings__Audience: rumi-e2e
      EmailSettings__SmtpHost: localhost
      EmailSettings__SmtpPort: '1025'
      EmailSettings__EnableSsl: 'false'
      EmailSettings__UseAuthentication: 'false'
      EmailSettings__Username: e2e
      EmailSettings__Password: e2e # pragma: allowlist secret
      EmailSettings__FromEmail: noreply@test.local
      EmailSettings__FromName: RUMI E2E
      EmailSettings__AdminEmail: e2e-admin@test.local
      EmailSettings__FrontendBaseUrl: http://localhost:3100
      EmailSettings__BackendBaseUrl: http://localhost:5221
      CorsSettings__AllowedOrigins__0: http://localhost:3100
      E2E_API_BASE_URL: http://localhost:5221
      UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots == true && 'true' || 'false' }}
      # Trusted (hardcoded matrix literal). Baked into the build + segments the
      # baseline path via playwright.screenshots.config.ts.
      SCREENSHOT_TEMPLATE: ${{ matrix.template }}
      # Trusted (hardcoded matrix literal). Passed via env, never interpolated
      # into a run: script (githubactions:S8264).
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      # The backend is PULLED, not compiled (2026-08-17, CI-PERFORMANCE-PLAN
      # §2). This job used to check the backend repo out at `ref: develop` and
      # `dotnet build` it: 73-84s for the build + 9-11s for `dotnet ef` + 7-9s
      # for setup-dotnet + 7s of NuGet cache restore, on every one of the three
      # backend-bearing legs a frontend PR runs (this job + two screenshot
      # templates). build-image.yml publishes the identical develop code to
      # GHCR on every develop push, tagged both `sha-<commit>` and `:staging`;
      # the image is 110MB compressed.
      #
      # Staleness, stated honestly: we resolve backend develop HEAD and pull
      # that exact `sha-` tag, so the normal case is the same commit the old
      # checkout compiled. Only when the image for that commit does not exist
      # yet (build-image.yml still running, i.e. the first few minutes after a
      # backend merge) do we fall back to `:staging`, the previous develop
      # build — one merge stale, and announced with a ::warning:: annotation so
      # a surprising red is traceable in the log. Note the old step was already
      # a moving target: `ref: develop` never tested the PR against a matched
      # or unmerged backend either.
      - name: Resolve backend image (develop HEAD, else :staging)
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          IMAGE=ghcr.io/piwas-21/restaurant-app-backend
          SHA=$(gh api repos/piwas-21/restaurant-app-backend/commits/develop --jq .sha)
          echo "backend develop HEAD: $SHA"
          if docker pull -q "$IMAGE:sha-$SHA"; then
            echo "BACKEND_IMAGE=$IMAGE:sha-$SHA" >> "$GITHUB_ENV"
          else
            echo "::warning::No published image for backend develop HEAD ($SHA) yet — build-image.yml has probably not finished. Falling back to :staging (the previous develop build, one merge stale)."
            docker pull -q "$IMAGE:staging"
            echo "BACKEND_IMAGE=$IMAGE:staging" >> "$GITHUB_ENV"
          fi

      # No `dotnet ef database update` step: the app applies its own migrations
      # and runs its entity seeders on startup (Program.cs ->
      # MigrateApplicationDatabaseAsync), which is exactly how it comes up on a
      # box. --network host so the container reaches the postgres/redis
      # service containers on localhost and the suite reaches the API on
      # localhost:5221. The env file is the job-level backend config, filtered
      # by prefix — the same variables `dotnet run` used to inherit.
      - name: Start backend (published image)
        run: |
          env | grep -E '^(ASPNETCORE_|ConnectionStrings__|JwtSettings__|EmailSettings__|CorsSettings__)' > /tmp/backend.env
          docker run -d --name rumi-backend --network host --env-file /tmp/backend.env "$BACKEND_IMAGE"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://localhost:5221/api/health >/dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend never came up. Last 200 log lines:"
          docker logs --tail 200 rumi-backend || true
          exit 1

      # AFTER the backend is up, because the schema now arrives with the app's
      # startup migration rather than a build-time `dotnet ef` step. Safe in
      # that order: the seed is idempotent (fixed UUIDs + ON CONFLICT DO
      # NOTHING) and the startup seeders write disjoint rows.
      - name: Seed test data
        env:
          PGPASSWORD: postgres123 # pragma: allowlist secret
        run: |
          psql -h localhost -U postgres -d restaurantdb \
            -v ON_ERROR_STOP=1 -f e2e/seed/seed.sql

      # Runs inside the version-pinned Playwright image so rendering matches
      # the committed (linux-generated) baselines byte-for-byte. The host
      # node_modules are reused — host and container are both linux x64.
      - name: Run screenshot suite (pinned Playwright container)
        run: |
          PW_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          UPDATE_FLAG=""
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            UPDATE_FLAG="--update-snapshots"
            echo "Regenerating baselines (--update-snapshots)"
          fi
          docker run --rm --init --ipc=host --network host \
            -v "$PWD":/work -w /work \
            -e CI=1 \
            -e E2E_API_BASE_URL="$E2E_API_BASE_URL" \
            -e SCREENSHOT_TEMPLATE="$SCREENSHOT_TEMPLATE" \
            "mcr.microsoft.com/playwright:v${PW_VERSION}-noble" \
            npx playwright test -c playwright.screenshots.config.ts \
            "--shard=${SHARD_INDEX}/2" $UPDATE_FLAG

      # Log dump BEFORE the container is removed — `docker rm -f` would take
      # the logs with it.
      - name: Dump backend log on failure
        if: failure()
        run: docker logs --tail 300 rumi-backend || true

      - name: Stop backend
        if: always()
        run: docker rm -f rumi-backend 2>/dev/null || true

      # On a comparison failure the *-actual/*-diff PNGs land in test-results/.
      - name: Upload diff images + report
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: screenshot-diffs-${{ matrix.template }}-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # workflow_dispatch + update_snapshots=true: download this artifact and
      # commit its contents to e2e/screenshots/__screenshots__/ on a branch.
      # NOTE since sharding: each leg regenerates only ITS shard's PNGs, so a full
      # regeneration means downloading ALL FOUR artifacts (2 templates x 2 shards)
      # and unpacking them over the same directory. They touch disjoint files.
      - name: Upload regenerated baselines
        if: env.UPDATE_SNAPSHOTS == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: screenshot-baselines-${{ matrix.template }}-shard${{ matrix.shard }}-${{ github.run_id }}
          path: e2e/screenshots/__screenshots__/
          retention-days: 14
          if-no-files-found: error

  # Aggregate gate carrying the EXACT branch-protection check name. The ruleset
  # requires a single context "playwright screenshots (visual baseline)", but the
  # matrix suffixes its checks with the matrix values — "(classic, 1)",
  # "(craft, 2)", … This job restores the stable required name and passes iff
  # EVERY matrix leg passed — so the required check tracks the template list AND
  # the shard count without a ruleset edit. A cancelled or skipped leg makes
  # `needs.*.result` something other than "success", so it reads as RED, never
  # as green.
  screenshots_result:
    name: playwright screenshots (visual baseline)
    if: always()
    needs: screenshot_diff
    runs-on: ubuntu-latest
    # Reads only the matrix result from the `needs` context — no repo access.
    permissions: {}
    steps:
      - name: Gate on matrix result
        env:
          RESULT: ${{ needs.screenshot_diff.result }}
        run: |
          echo "screenshot matrix result: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::a screenshot template leg did not pass"; exit 1; }
